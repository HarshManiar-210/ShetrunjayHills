services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: shetrunjay
      POSTGRES_PASSWORD: shetrunjay
      POSTGRES_DB: shetrunjay
    ports:
      # Host 5433 avoids clashing with a locally installed Postgres on 5432.
      # Containers on this compose network (added in Phase 8) still reach
      # this service at db:5432.
      - "5433:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./infra/postgis-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shetrunjay -d shetrunjay"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://shetrunjay:shetrunjay@db:5432/shetrunjay
      JWT_SECRET: dev-secret-change-me
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # baked in at build time (Next.js NEXT_PUBLIC_* vars are inlined into the
        # client bundle) — the browser reaches the api via the published host
        # port, not the container-internal DNS name, so this stays localhost
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgis-data:
